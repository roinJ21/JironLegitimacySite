<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiron - Official Legitimacy Page</title>

    <link rel="icon" href="https://imgur.com/010SBRY.jpg" type="image/jpeg">
    <meta property="og:title" content="Jiron - Official Legitimacy Page">
    <meta property="og:description" content="Verified proof of successful transactions.">
    <meta property="og:image" content="https://imgur.com/010SBRY.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="description" content="Jiron - Official Legitimacy Page. Videos and screenshots of successful transactions.">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-color: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --accent-color: #ff1744;
            --accent-glow: rgba(255, 23, 68, 0.3);
            --border-color: rgba(0, 0, 0, 0.08);
            --card-bg: #f6f7f9;
            --container-bg: #ffffff;
            --transition-speed: 0.6s;
        }

        [data-theme="dark"] {
            --bg-color: #0f0f0f;
            --text-primary: #ffffff;
            --text-secondary: #909090;
            --accent-glow: rgba(255, 23, 68, 0.4);
            --border-color: rgba(255, 255, 255, 0.1);
            --card-bg: #151515;
            --container-bg: #1a1a1a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 70px 20px 24px;
            transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
            overflow-x: hidden;
        }

        .theme-toggle {
            position: fixed;
            top: 22px;
            right: 22px;
            background: transparent;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .theme-toggle:hover { transform: scale(1.15) rotate(15deg); }
        .theme-toggle:focus-visible, .social-icon:focus-visible, .proof-card:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 3px;
        }

        .container { max-width: 860px; margin: 0 auto; }

        /* ---------- Profile ---------- */
        .profile-section { text-align: center; padding: 0 20px; margin-bottom: 44px; }

        .profile-image-wrapper {
            position: relative;
            width: 115px;
            height: 115px;
            margin: 0 auto 22px;
            animation: zoomBounce 1s ease 0.2s both, float 3s ease-in-out 1.2s infinite;
        }
        @keyframes zoomBounce {
            0% { opacity: 0; transform: scale(0) rotate(180deg); }
            60% { transform: scale(1.15) rotate(-10deg); }
            80% { transform: scale(0.95) rotate(5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0); }
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .profile-image {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            border: 4px solid var(--bg-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .glow-ring {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff1744, #ff5252, #ff1744);
            z-index: 1;
            animation: pulseGlow 3s ease-in-out infinite, colorShift 8s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.03); opacity: 1; filter: blur(1px); }
        }
        @keyframes colorShift {
            0%, 100% { background: linear-gradient(135deg, #ff1744, #ff5252, #ff1744); }
            28% { background: linear-gradient(135deg, #e91e63, #ff1744, #ff5252); }
            57% { background: linear-gradient(135deg, #667eea, #764ba2, #f093fb); }
            71% { background: linear-gradient(135deg, #4facfe, #00f2fe, #43e97b); }
            85% { background: linear-gradient(135deg, #43e97b, #38f9d7, #667eea); }
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .verified-badge {
            width: 20px; height: 20px;
            background: #1877f2;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(24, 119, 242, 0.35);
            animation: badgeSpin 4s linear 1.4s infinite;
        }
        .verified-badge svg { width: 11px; height: 11px; }
        @keyframes badgeSpin {
            0% { transform: rotate(0) scale(1); }
            25% { transform: rotate(0) scale(1.15); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(180deg) scale(1.15); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .profile-subtitle {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #667eea);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: gradShift 4s ease-in-out infinite;
        }
        @keyframes gradShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .profile-quote {
            font-size: 14px;
            color: var(--text-secondary);
            min-height: 24px;
            margin-bottom: 26px;
        }
        .typing-cursor {
            display: inline-block;
            width: 2px; height: 14px;
            background: currentColor;
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 49% { opacity: 0.8; } 50%, 100% { opacity: 0; } }

        .social-icons { display: flex; justify-content: center; gap: 22px; }
        .social-icon {
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            border: 1.5px solid var(--border-color);
            transition: transform 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            text-decoration: none;
        }
        .social-icon svg { width: 21px; height: 21px; fill: currentColor; }
        .social-icon:hover {
            transform: translateY(-4px) scale(1.1);
            color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 6px 16px var(--accent-glow);
        }

        /* ---------- Sections ---------- */
        .section { margin-bottom: 52px; }
        .section-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; text-align: center; }
        .section-desc { font-size: 14px; color: var(--text-secondary); text-align: center; margin: 6px auto 20px; max-width: 520px; }

        /* ---------- Video (16:9 ad format) ---------- */
        .video-frame {
            position: relative;
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.22);
            border: 1.5px solid var(--border-color);
        }
        .video-frame video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }

        /* ---------- Transaction Proof Album (Cards Container) ---------- */
        .album-wrapper {
            background: var(--container-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 760px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .album-title {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .proof-cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .proof-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            padding: 36px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-primary);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .proof-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .proof-icon {
            font-size: 42px;
            margin-bottom: 16px;
            line-height: 1;
        }

        .proof-card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }

        .proof-card-sub {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* ---------- Footer ---------- */
        .footer {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 14px;
            padding: 18px 4px 0;
            border-top: 1px solid var(--border-color);
        }
        .footer-text, .footer-time, .footer-date {
            font-size: 12px;
            font-weight: 600;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: rgbFlow 2s linear infinite;
        }
        .footer-text { text-align: center; }
        .footer-time { text-align: left; font-variant-numeric: tabular-nums; }
        .footer-date { text-align: right; }
        @keyframes rgbFlow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        @media (max-width: 600px) {
            body { padding-top: 64px; }
            .profile-name { font-size: 24px; }
            .proof-cards-grid { grid-template-columns: 1fr; gap: 14px; }
            .footer { grid-template-columns: 1fr 1fr; }
            .footer-text { grid-column: 1 / -1; order: -1; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <audio id="bgMusic" loop preload="auto">
        <source src="assets/background-music.mp3" type="audio/mpeg">
    </audio>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark theme"></button>

    <main class="container">
        <!-- Profile Section -->
        <section class="profile-section">
            <div class="profile-image-wrapper">
                <div class="glow-ring"></div>
                <img src="https://imgur.com/010SBRY.jpg" alt="Jiron profile picture" class="profile-image">
            </div>
            <h1 class="profile-name">
                <span id="profileName"></span>
                <span class="verified-badge" title="Verified">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </span>
            </h1>
            <p class="profile-subtitle">Official Legitimacy Page</p>
            <p class="profile-quote"><span id="quoteText"></span><span class="typing-cursor"></span></p>

        </section>

        <!-- Video Section -->
        <section class="section">

        <!-- Proof Album Section -->

                <div class="proof-cards-grid">
                    <a href="#" id="imageProofsLink" target="_blank" rel="noopener noreferrer" class="proof-card">
                        <div class="proof-icon">🖼️</div>
                        <div class="proof-card-title">Image Proofs</div>
                        <div class="proof-card-sub">Click to view all images</div>
                    </a>
                    <a href="#" id="videoProofsLink" target="_blank" rel="noopener noreferrer" class="proof-card">
                        <div class="proof-icon">📹</div>
                        <div class="proof-card-title">Video Proofs</div>
                        <div class="proof-card-sub">Click to view all videos</div>
                    </a>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <span class="footer-time" id="footerTime"></span>
            <span class="footer-text">© 2026 | Jiron Official Legitimacy Page</span>
            <span class="footer-date" id="footerDate"></span>
        </footer>
    </main>

    <script>
    /* ===========================================================
       CONFIG: Update your social profile & Google Drive URLs here.
       =========================================================== */
    const CONFIG = {
        name: 'Jiron',
        quotes: [
            'Verified seller. Real transactions.',
            'Proof of every successful deal is below.',
            'Trusted by buyers and sellers.'
        ],
        links: {
            facebook: 'https://www.facebook.com/share/19nqLeTFUh/',
            discord:  'https://discordapp.com/users/737631618440626216',
            telegram: 'https://t.me/roinj21'
        },
        video: {
            src: 'https://imgur.com/juMQkjO.mp4',
            poster: ''
        },
        driveLinks: {
            images: 'https://drive.google.com/drive/folders/1lyjAU1IJYMjB43AyK7mxT68zNcChSJqD?usp=sharing',
            videos: 'https://drive.google.com/drive/folders/YOUR_VIDEO_FOLDER_ID'
        }
    };

    const ICONS = {
        facebook: '<path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/>',
        discord: '<path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>',
        telegram: '<path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0a12 12 0 00-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>'
    };

    /* ---------- Populate Profile ---------- */
    document.getElementById('profileName').textContent = CONFIG.name;

    const socialBox = document.getElementById('socialIcons');
    ['facebook', 'discord', 'telegram'].forEach(key => {
        const a = document.createElement('a');
        a.className = 'social-icon';
        a.href = CONFIG.links[key];
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.setAttribute('aria-label', key.charAt(0).toUpperCase() + key.slice(1));
        a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[key] + '</svg>';
        socialBox.appendChild(a);
    });

    /* ---------- Bind Drive Links ---------- */
    document.getElementById('imageProofsLink').href = CONFIG.driveLinks.images;
    document.getElementById('videoProofsLink').href = CONFIG.driveLinks.videos;

    /* ---------- Typing Quote Effect ---------- */
    (function typeQuotes() {
        const el = document.getElementById('quoteText');
        let q = 0, i = 0, deleting = false;
        function tick() {
            const text = CONFIG.quotes[q];
            el.textContent = text.slice(0, i);
            let delay = deleting ? 30 : 60;
            if (!deleting && i === text.length) { deleting = true; delay = 1800; }
            else if (deleting && i === 0) { deleting = false; q = (q + 1) % CONFIG.quotes.length; delay = 400; }
            i += deleting ? -1 : 1;
            setTimeout(tick, delay);
        }
        tick();
    })();

    /* ---------- Theme Switching ---------- */
    (function theme() {
        const btn = document.getElementById('themeToggle');
        let saved = 'dark';
        try { saved = localStorage.getItem('theme') || 'dark'; } catch (e) {}
        function apply(t) {
            document.documentElement.setAttribute('data-theme', t);
            btn.textContent = t === 'dark' ? '☀️' : '🌙';
        }
        apply(saved);
        btn.addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            apply(next);
            try { localStorage.setItem('theme', next); } catch (e) {}
        });
    })();

    /* ---------- Main Video Init ---------- */
    (function mainVideo() {
        const v = document.getElementById('mainVideo');
        v.src = CONFIG.video.src;
        if (CONFIG.video.poster) v.poster = CONFIG.video.poster;
    })();

    /* ---------- Background Music Logic ---------- */
    (function bgMusic() {
        const music = document.getElementById('bgMusic');
        const video = document.getElementById('mainVideo');
        music.volume = 0.35;
        let pausedByVideo = false;
        let started = false;

        function start() {
            if (started || pausedByVideo) return;
            music.play().then(() => {
                started = true;
                removeTriggers();
            }).catch(() => {});
        }

        const triggers = ['click', 'touchstart', 'keydown', 'scroll'];
        function removeTriggers() {
            triggers.forEach(t => document.removeEventListener(t, start));
        }
        triggers.forEach(t => document.addEventListener(t, start, { passive: true }));
        start();

        video.addEventListener('play', () => {
            if (!music.paused) { music.pause(); pausedByVideo = true; }
            else pausedByVideo = true;
        });
        function resume() {
            pausedByVideo = false;
            music.play().then(() => { started = true; }).catch(() => {});
        }
        video.addEventListener('pause', resume);
        video.addEventListener('ended', resume);
    })();

    /* ---------- Philippine Time Clock ---------- */
    (function clock() {
        const timeEl = document.getElementById('footerTime');
        const dateEl = document.getElementById('footerDate');
        const tz = 'Asia/Manila';
        function update() {
            const now = new Date();
            timeEl.textContent = now.toLocaleTimeString('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }) + ' PHT';
            dateEl.textContent = now.toLocaleDateString('en-US', { timeZone: tz, weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' });
        }
        update();
        setInterval(update, 1000);
    })();
    </script>
</body>
